# lychee link checker config -- https://lychee.cli.rs
#
# Only markdown files are scanned. Anchors on external pages are not
# verified, only that each URL and each relative file link resolves.

extensions = ["md"]
max_retries = 3
retry_wait_time = 5
timeout = 20

# A 429 means the host is alive and throttling a CI runner, not that the
# link is dead. YouTube and Microsoft Learn both do this from shared
# runners, and the learning material page links to both.
accept = ["200..=299", "429"]

# bin/ and obj/ are gitignored build output, not content of this repo.
exclude_path = [
  "bin",
  "obj",
]
